<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gridHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e85f"/>
      <stop offset="100%" stop-color="#5fa820"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" ry="48" fill="#202326"/>
  <rect x="6" y="6" width="244" height="244" rx="42" ry="42" fill="none" stroke="#2b2e33" stroke-width="2"/>

  <!-- Matriz 3x3 com 1 quadrado destacado (centro) -->
  <g>
    <!-- Linha 1 -->
    <rect x="44" y="44" width="52" height="52" rx="8" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>
    <rect x="102" y="44" width="52" height="52" rx="8" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>
    <rect x="160" y="44" width="52" height="52" rx="8" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>

    <!-- Linha 2 -->
    <rect x="44" y="102" width="52" height="52" rx="8" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>
    <!-- Centro destacado -->
    <rect x="102" y="102" width="52" height="52" rx="8" fill="url(#gridHi)" stroke="#3d7c12" stroke-width="2.5"/>
    <!-- Folha centralizada vertical+horizontalmente dentro do quadrado verde.
         Quadrado: x=102..154, y=102..154 → centro (128, 128).
         Folha ocupa y de 116 a 140 (centro em y=128) com altura 24px. -->
    <path d="M128 116 Q142 128 128 140 Q114 128 128 116 Z" fill="#202326" opacity="0.55"/>
    <line x1="128" y1="116" x2="128" y2="140" stroke="#202326" stroke-width="1.5"/>
    <rect x="160" y="102" width="52" height="52" rx="8" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>

    <!-- Linha 3 -->
    <rect x="44" y="160" width="52" height="52" rx="8" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>
    <rect x="102" y="160" width="52" height="52" rx="8" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>
    <rect x="160" y="160" width="52" height="52" rx="8" fill="#2b2e33" stroke="#3c4149" stroke-width="2"/>
  </g>

  <!-- Pequeno indicador de "pulse" no quadrado destacado -->
  <circle cx="148" cy="108" r="4" fill="#a3e85f"/>
</svg>